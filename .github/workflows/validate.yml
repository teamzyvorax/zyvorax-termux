name: ZYVORAX package checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependency
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: Validate shell syntax
        run: |
          bash -n packages/zyvorax/zyvorax
          bash -n packages/zyvorax/build.sh
          bash -n packages/zyvora/zyvorax
          bash -n packages/zyvora/build.sh
          bash -n scripts/build-termux-package.sh

      - name: Test CLI basics
        run: |
          bash packages/zyvorax/zyvorax version
          bash packages/zyvorax/zyvorax help
          test "$(bash packages/zyvorax/zyvorax calc '25 * 40')" = "1000"

      - name: Validate package metadata
        run: |
          grep -q '^TERMUX_PKG_VERSION=' packages/zyvorax/build.sh
          grep -q '^TERMUX_PKG_PLATFORM_INDEPENDENT=true$' packages/zyvorax/build.sh

      - name: Check whitespace
        run: git diff --check
